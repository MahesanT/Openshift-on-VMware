name: Build LinkedIn Preview

on:
  push:
    paths:
      - "docs/assets/openshift-linkedin-preview.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render social preview
        run: |
          rsvg-convert -w 1200 -h 627 docs/assets/openshift-linkedin-preview.svg -o docs/assets/openshift-linkedin-preview.png
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/openshift-linkedin-preview.png
          git diff --cached --quiet || git commit -m "Update LinkedIn preview image"
          git push
